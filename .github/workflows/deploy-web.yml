name: Deploy Flutter Web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Resolve production API URL
        id: api_url
        env:
          API_BASE_URL: ${{ secrets.PRODUCTION_API_BASE_URL || vars.PRODUCTION_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ "$API_BASE_URL" = "https://YOUR-PUBLIC-API-DOMAIN" ]; then
            echo "PRODUCTION_API_BASE_URL must be set to the HTTPS Cloudflare Tunnel URL." >&2
            exit 1
          fi
          echo "api_base_url=$API_BASE_URL" >> "$GITHUB_OUTPUT"

      - name: Build web
        working-directory: frontend
        env:
          API_BASE_URL: ${{ steps.api_url.outputs.api_base_url }}
        run: flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Verify build output
        working-directory: frontend
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy frontend/build/web --project-name=quickbite-web --branch=main
