server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;
    set $api_upstream api;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy to backend service (same origin for the web app).
    location /api/ {
        proxy_pass http://$api_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health endpoints proxied for container/uptime checks.
    location /health/ {
        proxy_pass http://$api_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Backend-served static assets (restaurant/menu photographs).
    location /static/ {
        proxy_pass http://$api_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache";
    }
}
